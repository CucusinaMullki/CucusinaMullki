Баннер — это HTML с анимациями, а GitHub не поддерживает HTML/CSS/JS в README. Вот что реально работает:
Вариант 1 — Скриншот (проще всего)

    Открой скачанный HTML-файл в браузере
    Сделай скриншот баннера
    Загрузи картинку в репозиторий (например assets/banner.png)
    В README.md добавь:

md

![banner](assets/banner.png)

Минус: статичная картинка, без анимации.
Вариант 2 — SVG с анимацией (работает на GitHub!)

GitHub разрешает SVG с CSS-анимациями прямо в README. Я могу переделать твой баннер в анимированный SVG — мигающий курсор, сканирующая линия и всё остальное будет живым.

Просто напиши «сделай SVG» и я переделаю.
Вариант 3 — Vercel / GitHub Pages

    Задеплой HTML на vercel.com бесплатно
    Сделай скриншот через shots.so или og-image
    Вставь как картинку

